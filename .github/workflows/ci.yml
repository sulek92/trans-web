name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  api:
    name: API Lint Build E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint --workspace apps/api

      - name: Build API
        run: npm run build --workspace apps/api

      - name: E2E API
        run: npm run test:e2e --workspace apps/api

  web:
    name: Web Lint Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Web
        run: npm run lint --workspace apps/web

      - name: Build Web
        run: npm run build --workspace apps/web

  web_e2e_smoke:
    name: Web E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: cd apps/web && npx playwright test tests/e2e/admin-and-graphics.spec.ts tests/e2e/admin-navigation.spec.ts
