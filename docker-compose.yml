services:
  postgres:
    image: postgres:15-alpine
    container_name: palety-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: palety_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    container_name: palety-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: palety-api
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
    command: npm run dev --workspace=api
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/palety_db
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - AUTH_REDIS_PREFIX=auth
      - APP_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      - LEGACY_AUTH_FALLBACK_ENABLED=true
      - SUPERADMIN_PASSWORD=admin1
      - ADMIN_PASSWORD=admin123
      - DB_POOL_MAX=5
      - DB_POOL_IDLE_TIMEOUT_MS=15000
      - DB_POOL_CONNECTION_TIMEOUT_MS=5000
      - DB_STATEMENT_TIMEOUT_MS=30000
      - NODE_OPTIONS=--max-old-space-size=512 --max-semi-space-size=32
      - JWT_SECRET=local-secret
      - NEXTAUTH_SECRET=local-secret
      - NODE_ENV=development
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: palety-web
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
    command: npm run dev --workspace=web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL_INTERNAL=http://api:4000
      - NODE_OPTIONS=--max-old-space-size=512 --max-semi-space-size=32
      - NODE_ENV=development
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  tunnel:
    build:
      context: ./tools/tunnel-manager
    container_name: palety-tunnel
    environment:
      - API_URL=http://api:4000
      - TARGET_URL=http://web:3000
      - TUNNEL_SECRET=${TUNNEL_SECRET}
    depends_on:
      - api
      - web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  postgres_data:
  redis_data:
