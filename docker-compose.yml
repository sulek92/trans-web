services:
  postgres:
    image: postgres:15-alpine
    container_name: palety-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: palety_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: palety-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: palety-api
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/palety_db
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - AUTH_REDIS_PREFIX=auth
      - APP_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      - LEGACY_AUTH_FALLBACK_ENABLED=false
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: palety-web
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL_INTERNAL=http://api:4000
      - NODE_OPTIONS=--max-old-space-size=4096
    depends_on:
      - api
    restart: unless-stopped

  tunnel:
    build:
      context: ./tools/tunnel-manager
    container_name: palety-tunnel
    environment:
      - API_URL=http://api:4000
      - TARGET_URL=http://web:3000
      - TUNNEL_SECRET=${TUNNEL_SECRET}
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
